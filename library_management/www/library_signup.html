{% extends "templates/web.html" %}

{% block page_content %}
<div class="signup-page" style="max-width:500px;margin:40px auto;">
    <h2>Library Membership Signup</h2>
    <form id="library_signup_form">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" class="form-control">
        </div>
        <div class="form-group">
            <label for="membership_type">Membership Type</label>
            <select id="membership_type" name="membership_type" class="form-control">
                <option value="Student">Student</option>
                <option value="Faculty">Faculty</option>
                <option value="External">External Member</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register Membership</button>
        <p id="form_message" style="margin-top:10px;"></p>
    </form>
</div>

<script>
document.getElementById('library_signup_form').addEventListener('submit', function (e) {
    e.preventDefault();

    frappe.call({
        method: "library_management.library_management.api.submit_library_signup",
        args: {
            full_name: document.getElementById('full_name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            membership_type: document.getElementById('membership_type').value,
        },
        callback: function (r) {
            const msg = document.getElementById('form_message');
            if (r.message && r.message.status === "success") {
                msg.style.color = "green";
                msg.innerText = r.message.message;
                document.getElementById('library_signup_form').reset();
            } else {
                msg.style.color = "red";
                msg.innerText = "Something went wrong.";
            }
        },
        error: function () {
            document.getElementById('form_message').innerText = "Error submitting form.";
        }
    });
});
</script>
{% endblock %}
